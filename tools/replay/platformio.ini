; F28 — standalone native replay project (spec §7, D9).
;
; Rebuilds the SAME bw_signal pipeline the device runs (lib_extra_dirs points
; at firmware/lib) and replays a recorded session's raw rows, so
; tools/replay/compare.py can diff host-regenerated features against the
; device's recorded features.csv. Deliberately NOT referenced by
; firmware/platformio.ini: `pio run`/`pio test` in the firmware tree never
; touch this project (exit criteria of §15: full-repo CI unchanged).

[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
lib_extra_dirs = ../../firmware/lib
