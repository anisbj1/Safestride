; PlatformIO project — ESP32-WROOM                                     [F00]
; Envs: esp32dev (target), native (host unit tests, Unity)

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include
test_dir = test

[env]
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
lib_ldf_mode = deep+

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; W3 P4 (2026-10-13): F18's partition table (spec §14 — two OTA-sized app
; slots plus the LittleFS data partition the storage feature formats on
; first boot). F18 owns partitions.csv; this env line is the integrator's
; activation (F18 spec §2 Owns excludes platformio.ini on purpose).
board_build.partitions = partitions.csv
lib_deps =
    NimBLE-Arduino
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -DUNIT_TEST
